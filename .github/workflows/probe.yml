name: probe
on:
  push:
    branches: [claude/vibrant-goldberg-hmqflw]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests feedparser googlenewsdecoder
      - shell: python
        run: |
          import feedparser, requests, time
          from urllib.parse import quote
          q = quote("site:nikkei.com 日銀 when:1d")
          f = feedparser.parse(f"https://news.google.com/rss/search?q={q}&hl=ja&gl=JP&ceid=JP:ja")
          print("GN entries", len(f.entries))
          from googlenewsdecoder import gnewsdecoder
          for e in f.entries[:3]:
              print(e.title, e.link[:80])
              t=time.time(); r = gnewsdecoder(e.link, interval=1); print("  decoded:", r, round(time.time()-t,1),"s")
          for u in ["https://assets.wor.jp/rss/rdf/nikkei/news.rdf","https://assets.wor.jp/rss/rdf/nikkei/economy.rdf","https://www.nikkei.com/rss/"]:
              g = feedparser.parse(u); print(u, g.get("status"), len(g.entries))
              for e in g.entries[:2]: print("  ", e.get("published",e.get("updated","")), e.title, e.link)
